- id: esa_landcover_yearly
  name: Land Cover (ESA CCI)
  short_name: Land Cover
  variable: lccs_class
  period_type: yearly
  sync:
    kind: release
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1992"
      resolution: P1Y
  ingestion:
    plugin: rasters.esa_landcover.EsaLandCoverPlugin
    params: {}
  units: null
  resolution: 300m x 300m
  source: ESA CCI Land Cover v2
  source_url: https://cds.copernicus.eu/datasets/satellite-land-cover
  display:
    palette:
      0:   "#000000"  # No data
      10:  "#ffff64"  # Cropland, rainfed
      11:  "#ffff64"  # Cropland, rainfed — herbaceous cover
      12:  "#ffff00"  # Cropland, rainfed — tree/shrub cover
      20:  "#aaf0f0"  # Cropland, irrigated or post-flooding
      30:  "#dcf064"  # Mosaic cropland (>50%) / natural vegetation
      40:  "#c8c864"  # Mosaic natural vegetation (>50%) / cropland
      50:  "#006400"  # Tree cover, broadleaved, evergreen, closed–open
      60:  "#00a000"  # Tree cover, broadleaved, deciduous, closed–open
      61:  "#00a000"  # Tree cover, broadleaved, deciduous, closed
      62:  "#aac800"  # Tree cover, broadleaved, deciduous, open
      70:  "#003c00"  # Tree cover, needleleaved, evergreen, closed–open
      71:  "#003c00"  # Tree cover, needleleaved, evergreen, closed
      72:  "#005000"  # Tree cover, needleleaved, evergreen, open
      80:  "#285000"  # Tree cover, needleleaved, deciduous, closed–open
      81:  "#285000"  # Tree cover, needleleaved, deciduous, closed
      82:  "#286400"  # Tree cover, needleleaved, deciduous, open
      90:  "#788200"  # Tree cover, mixed leaf type
      100: "#8ca000"  # Mosaic tree and shrub (>50%) / herbaceous cover
      110: "#be9600"  # Mosaic herbaceous cover (>50%) / tree and shrub
      120: "#966400"  # Shrubland
      121: "#966400"  # Evergreen shrubland
      122: "#966400"  # Deciduous shrubland
      130: "#ffb432"  # Grassland
      140: "#ffdcd2"  # Lichens and mosses
      150: "#ffebaf"  # Sparse vegetation (<15%)
      151: "#ffc864"  # Sparse tree
      152: "#ffd278"  # Sparse shrub
      153: "#ffebaf"  # Sparse herbaceous cover
      160: "#00785a"  # Tree cover, flooded, fresh or brackish water
      170: "#009678"  # Tree cover, flooded, saline water
      180: "#00dc82"  # Shrub/herbaceous cover, flooded
      190: "#c31400"  # Urban areas
      200: "#fff5d7"  # Bare areas
      201: "#dcdcdc"  # Consolidated bare areas
      202: "#fff5d7"  # Unconsolidated bare areas
      210: "#0046c8"  # Water bodies
      220: "#ffffff"  # Permanent snow and ice
